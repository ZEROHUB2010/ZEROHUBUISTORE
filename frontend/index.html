<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ZEROHUBUI APPS</title>
<meta name="description" content="ZEROHUBUI APPS — каталоги барномаҳо, бозиҳо ва модҳо">
<link rel="stylesheet" href="assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- 3D Z Letters (decorative, corners) -->
<div class="z3d-wrap z3d-tl"><div class="z3d"><span>Z</span><span>Z</span><span>Z</span><span>Z</span><span>Z</span><span>Z</span></div></div>
<div class="z3d-wrap z3d-br"><div class="z3d"><span>Z</span><span>Z</span><span>Z</span><span>Z</span><span>Z</span><span>Z</span></div></div>

<!-- HEADER -->
<header style="padding:20px 18px 10px; position:sticky; top:0; z-index:40; background:var(--bg-0);">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 class="aurora-text" style="font-size:26px; margin:0;">ZEROHUBUI</h1>
    <button id="langBtn" class="chip" onclick="toggleLang()">RU</button>
  </div>
  <div class="panel" style="margin-top:14px; padding:4px 14px; display:flex; align-items:center; gap:10px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aab" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" class="input" style="border:none; background:transparent; padding:12px 0;"
      placeholder="Ҷустуҷӯ..." oninput="onSearch()">
  </div>
</header>

<!-- MAIN -->
<main style="padding:14px 18px 100px; min-height:60vh;">
  <div id="content"></div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span data-i18n="home">Асосӣ</span>
  </button>
  <button class="nav-item" data-tab="app" onclick="switchTab('app')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="3"/><line x1="10" y1="19" x2="14" y2="19"/></svg>
    <span data-i18n="apps">Барномаҳо</span>
  </button>
  <button class="nav-item" data-tab="game" onclick="switchTab('game')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="7" width="20" height="12" rx="4"/><line x1="7" y1="12" x2="11" y2="12"/><line x1="9" y1="10" x2="9" y2="14"/><circle cx="16.5" cy="10.5" r="1"/><circle cx="18.5" cy="13" r="1"/></svg>
    <span data-i18n="games">Бозиҳо</span>
  </button>
  <button class="nav-item" data-tab="moding" onclick="switchTab('moding')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>
    <span data-i18n="moding">MODING</span>
  </button>
</nav>

<script src="assets/supabase-client.js"></script>
<script>
const I18N = {
  tj:{home:"Асосӣ",apps:"Барномаҳо",games:"Бозиҳо",moding:"MODING",search:"Ҷустуҷӯ...",empty:"Ҳанӯз чизе нест",downloads:"зеркашӣ",featured:"Интихобшуда",all:"Ҳама"},
  ru:{home:"Главная",apps:"Приложения",games:"Игры",moding:"MODING",search:"Поиск...",empty:"Пока пусто",downloads:"загрузок",featured:"Рекомендуем",all:"Все"}
};
let lang = localStorage.getItem("zh_lang") || "tj";
let currentTab = "home";
let allCache = { app:[], game:[], moding:[] };

function applyLang(){
  document.documentElement.lang = lang === "tj" ? "tg" : "ru";
  document.getElementById("langBtn").textContent = lang === "tj" ? "RU" : "TJ";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  document.getElementById("searchInput").placeholder = I18N[lang].search;
}
function toggleLang(){
  lang = lang === "tj" ? "ru" : "tj";
  localStorage.setItem("zh_lang", lang);
  applyLang();
  render();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  render();
}

function appCard(a){
  const name = lang === "tj" ? a.name_tj : (a.name_ru || a.name_tj);
  const icon = a.icon_url || "https://placehold.co/112x112/14141d/9a9aab?text=Z";
  return `
  <a class="panel app-card" href="app.html?slug=${a.slug}" style="text-decoration:none; color:inherit;">
    <img class="app-icon" src="${icon}" alt="${name}" loading="lazy">
    <div class="app-info">
      <p class="app-name">${name}</p>
      <div class="app-meta">
        <span>${a.version || ""}</span>
        <span>•</span>
        <span>${(a.downloads_count||0).toLocaleString()} ${I18N[lang].downloads}</span>
      </div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aab" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </a>`;
}

async function loadSection(section){
  if (!allCache[section].length){
    allCache[section] = await fetchApps({ section });
  }
  return allCache[section];
}

async function render(){
  const el = document.getElementById("content");
  el.innerHTML = `<p style="text-align:center; color:var(--text-dim); padding:40px 0;">…</p>`;
  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  if (currentTab === "home"){
    const [apps, games, moding] = await Promise.all([loadSection("app"), loadSection("game"), loadSection("moding")]);
    const featured = [...apps, ...games, ...moding].filter(a=>a.featured).slice(0,6);
    el.innerHTML = `
      <h2 class="glow-text" style="font-size:18px; margin:6px 0 12px;">⭐ ${I18N[lang].featured}</h2>
      ${featured.length ? featured.map(appCard).join("") : `<p style="color:var(--text-dim)">${I18N[lang].empty}</p>`}
    `;
    return;
  }

  let list = await loadSection(currentTab);
  if (q){
    list = list.filter(a =>
      (a.name_tj||"").toLowerCase().includes(q) ||
      (a.name_ru||"").toLowerCase().includes(q) ||
      (a.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  el.innerHTML = list.length ? list.map(appCard).join("") : `<p style="color:var(--text-dim); text-align:center; padding:30px 0;">${I18N[lang].empty}</p>`;
}

let searchTimer;
function onSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 120); // live-search, тез
}

applyLang();
render();
</script>
</body>
</html>
